<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>if(location.protocol==="http:"&&!/^(localhost|127\.)/.test(location.hostname))location.replace("https://"+location.host+location.pathname+location.search+location.hash);</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="The digital portfolio of Rhaine Kylle Balabag, an IT student from Baguio City, Philippines.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Rhaine Kylle Balabag — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="content.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="loader" id="loader" role="status" aria-live="polite">
    <div class="loader-world" id="loader-world"><canvas id="loader-canvas" aria-hidden="true"></canvas></div>
    <div class="loader-vignette" aria-hidden="true"></div>
    <p class="loader-brand"><span data-t="loader.title">RHAINE</span><b>.</b></p>
    <div class="loader-dash" id="loader-dash" aria-hidden="true">
      <div class="ld-gauge ld-tach" id="ld-tach"></div>
      <div class="ld-center">
        <div class="ld-shift"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="ld-gearbox"><small>GEAR</small><b id="ld-gear">N</b></div>
        <div class="ld-lamps">
          <span class="ld-lamp amber" title="Engine"><svg viewBox="0 0 24 24"><path d="M4 10h2V8h4V6h4v2h3l2 3h2v5h-2l-2 3H9l-2-2H4z"/></svg></span>
          <span class="ld-lamp red" title="Battery"><svg viewBox="0 0 24 24"><path d="M3 7h18v12H3zM6 4h3v3H6zm9 0h3v3h-3zM6 12h4v1H6zm8 0h4v1h-4zm1.5-1.5h1v4h-1z"/></svg></span>
          <span class="ld-lamp red" title="Oil"><svg viewBox="0 0 24 24"><path d="M3 11h7l2-2h4l5 3-6 6H5l-2-3zm16-6c1 2 2 3 2 4a2 2 0 0 1-4 0c0-1 1-2 2-4z"/></svg></span>
          <span class="ld-lamp red" title="Seat belt"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2.5"/><path d="M8 9h8l1 7h-3v5h-4v-5H7zM9 9l7 9-1 1-7-9z"/></svg></span>
          <span class="ld-lamp amber" title="ABS"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/><text x="12" y="15" text-anchor="middle" font-size="6.5" font-weight="700" font-family="Arial">ABS</text></svg></span>
        </div>
        <div class="ld-odo"><span id="ld-odo">128440</span><small>KM</small></div>
      </div>
      <div class="ld-gauge ld-speedo" id="ld-speedo"></div>
    </div>
    <div class="loader-foot"><span id="loader-status">SYSTEM CHECK…</span><b id="loader-percent">0%</b><div class="loader-bar"><i id="loader-fill"></i></div></div>
  </div>
  <div class="page-shift" id="page-shift" aria-hidden="true">
    <div class="ps-panel"><div class="ps-streaks"></div><div class="ps-edge"></div>
      <div class="ps-label"><span class="ps-mark"><b>R</b><b>B</b></span><span class="ps-title" id="ps-title"></span><span class="ps-line"><i></i></span></div>
    </div>
  </div>
  <div class="page-wipe" id="page-wipe" aria-hidden="true"></div>
  <div class="cursor-ring" id="cursor-ring" aria-hidden="true"></div>
  <div class="cursor-dot" id="cursor-dot" aria-hidden="true"></div>
  <div class="portfolio-shell">
    <canvas class="bg-canvas" id="bg-canvas" aria-hidden="true"></canvas>
    <header class="site-header">
      <button class="brand" type="button" data-view="home" aria-label="Rhaine — go to Home">
        <span class="brand-symbol" aria-hidden="true"><span data-t="brand.initialA">R</span><span data-t="brand.initialB">B</span></span>
        <span class="brand-word"><span data-t="brand.word">RHAINE</span><span class="brand-period">.</span></span>
      </button>

      <nav class="primary-nav" aria-label="Main navigation">
        <button class="nav-button is-active" type="button" data-view="home" data-t="nav.home" aria-current="page">Home</button>
        <button class="nav-button" type="button" data-view="about" data-t="nav.about">Personal Information</button>
        <button class="nav-button" type="button" data-view="education" data-t="nav.education">Achievements</button>
        <button class="nav-button" type="button" data-view="family-friends" data-t="nav.family">Family &amp; Friends</button>
      </nav>

      <button class="button button-primary header-cta" type="button" data-view="about">
        <span data-t="cta">Let's Connect</span><i class="bx bx-arrow-up-right" aria-hidden="true"></i>
      </button>
    </header>

    <main class="screen-stage">
      <div class="content-region" id="content-region" aria-live="polite" aria-atomic="true"></div>
    </main>

    <!-- PREVIOUS / NEXT bar: lets visitors move through the tabs in order. Filled in by script.js (updatePager). -->
    <nav class="page-pager" id="page-pager" aria-label="Page navigation">
      <button class="pager-btn pager-prev" id="pager-prev" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        <span class="pager-text"><small class="pager-dir">Previous</small><strong class="pager-name"></strong></span>
      </button>
      <span class="pager-dots" id="pager-dots">
        <button class="pager-dot" type="button" data-view="home" aria-label="Home"></button>
        <button class="pager-dot" type="button" data-view="about" aria-label="Personal Information"></button>
        <button class="pager-dot" type="button" data-view="education" aria-label="Achievements"></button>
        <button class="pager-dot" type="button" data-view="family-friends" aria-label="Family &amp; Friends"></button>
      </span>
      <button class="pager-btn pager-next" id="pager-next" type="button">
        <span class="pager-text"><small class="pager-dir">Next</small><strong class="pager-name"></strong></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </nav>
    <span class="screen-grain" aria-hidden="true"></span>
  </div>

  <template id="view-home">
    <section class="view-panel home-view" aria-labelledby="home-title">
      <div class="gauge-cluster gauge-left" aria-hidden="true">
        <div class="instrument-dial gauge-primary">
          <span class="dial-label dial-label-low">10</span><span class="dial-label dial-label-high">100</span>
          <span class="dial-needle"></span><span class="dial-hub"></span>
        </div>
      </div>

      <div class="home-center-stack">
        <div class="portrait-stage">
          <div class="portrait-orbit" aria-hidden="true"></div>
          <div class="portrait-frame">
            <img class="portrait-image" id="portrait-image" alt="Portrait of Rhaine Kylle Balabag" hidden>
          </div>
        </div>

        <div class="home-copy">
          <h1 class="home-name" id="home-title" aria-label="Rhaine Kylle Balabag"><span class="typed-output" aria-hidden="true"></span><span class="typing-caret" aria-hidden="true"></span></h1>
          <p class="hero-heading" data-t="home.hero" data-accent="role-accent"><span class="role-accent">IT STUDENT</span> AND ASPIRING DEVELOPER</p>
          <div class="home-socials" id="home-socials" aria-label="Social profiles"></div>
          <div class="hero-actions">
            <button class="button button-primary" type="button" data-view="education"><span data-t="home.explore">Explore My Work</span><i class="bx bx-right-arrow-alt" aria-hidden="true"></i></button>
            <button class="button button-secondary" id="cv-button" type="button" disabled title="Add your CV file path to cvUrl in content.js to enable downloads."><i class="bx bx-download" aria-hidden="true"></i><span data-t="home.cv">Download CV</span></button>
          </div>
          <div class="quick-facts" aria-label="Explore more">
            <button class="fact-card" type="button" data-view="education"><span class="fact-icon"><i class="bx bx-book-open" aria-hidden="true"></i></span><span><strong data-t="home.facts.0.title">IT Student</strong><small data-t="home.facts.0.caption">Building my foundation</small></span></button>
            <button class="fact-card" type="button" data-view="education"><span class="fact-icon"><i class="bx bx-code-alt" aria-hidden="true"></i></span><span><strong data-t="home.facts.1.title">Web Development</strong><small data-t="home.facts.1.caption">Learning by creating</small></span></button>
            <button class="fact-card" type="button" data-view="about"><span class="fact-icon"><i class="bx bx-refresh" aria-hidden="true"></i></span><span><strong data-t="home.facts.2.title">Continuous Learning</strong><small data-t="home.facts.2.caption">One step at a time</small></span></button>
          </div>
        </div>
      </div>

      <div class="gauge-cluster gauge-right" aria-hidden="true">
        <div class="instrument-dial gauge-primary">
          <span class="dial-label dial-label-low">10</span><span class="dial-label dial-label-high">100</span>
          <span class="dial-needle"></span><span class="dial-hub"></span>
        </div>
      </div>
    </section>
  </template>

  <template id="view-about">
    <section class="view-panel inner-view profile-page about-page" aria-labelledby="about-title">
      <div class="about-layout about-reference-layout about-profile-layout">
        <figure class="about-photo-frame">
          <img class="about-profile-photo" alt="Rhaine Kylle Balabag in graduation attire with medals" loading="eager" decoding="async" hidden>
        </figure>
        <article class="about-copy about-profile-copy">
          <p class="eyebrow"><span class="eyebrow-line"></span> <span data-t="about.eyebrow">ABOUT ME / PROFILE</span></p>
          <header class="about-profile-heading">
            <h1 id="about-title"><span id="about-name-first"></span> <span class="about-name-accent" id="about-name-last"></span></h1>
            <p class="about-profile-role"><span class="about-live-dot" aria-hidden="true"></span><span id="about-role"></span></p>
          </header>
          <div class="about-profile-content">
            <dl class="about-facts" id="about-facts" aria-label="Personal details"></dl>
            <section class="about-education-strip" aria-label="Education">
              <div class="about-education-caption"><span class="about-section-label" data-t="about.education">EDUCATION</span><span class="about-year-badge" id="about-year"></span></div>
              <strong class="about-college-name" id="about-college"></strong>
              <p class="about-course-row"><span data-t="about.course">COURSE</span><span id="about-course"></span></p>
            </section>
            <div class="about-topic-grid">
              <section class="about-topic" aria-labelledby="about-hobbies-title">
                <h2 id="about-hobbies-title" data-t="about.hobbies">HOBBIES</h2>
                <ul class="about-tag-list" id="about-hobbies"></ul>
              </section>
              <section class="about-topic" aria-labelledby="about-interests-title">
                <h2 id="about-interests-title" data-t="about.interests">INTERESTS</h2>
                <ul class="about-tag-list" id="about-interests"></ul>
              </section>
              <section class="about-topic" aria-labelledby="about-skills-title">
                <h2 id="about-skills-title" data-t="about.skills">SKILLS</h2>
                <ul class="about-tag-list" id="about-skills"></ul>
              </section>
              <section class="about-topic" aria-labelledby="about-technical-title">
                <h2 id="about-technical-title" data-t="about.technical">TECHNICAL SKILLS</h2>
                <ul class="about-tag-list" id="about-technical-skills"></ul>
              </section>
            </div>
            <section class="about-statement" aria-label="Personal statement">
              <span class="about-section-label" data-t="about.statement">PERSONAL STATEMENT</span>
              <p id="about-statement"></p>
            </section>
          </div>
        </article>
      </div>
    </section>
  </template>

  <template id="view-education">
    <!-- ACHIEVEMENTS PAGE: 1) Educational stages (building = card background, diploma on top)  2) Certificates strip.
         The cards, certificates and diplomas are filled in by script.js from content.js. -->
    <section class="view-panel inner-view achievements-page" aria-labelledby="education-title">


      <!-- 1. Certificates (on top): a strip that moves on its own, stops while the cursor is on it -->
      <section class="ach-block cert-block" aria-labelledby="cert-title">
        <h2 class="ach-subheading" id="cert-title" data-t="education.certificatesTitle" data-accent="ach-accent"><span class="ach-accent">CERTIFICATES</span></h2>
        <div class="cert-carousel" id="cert-carousel">
          <div class="cert-viewport"><div class="cert-track" id="cert-track"></div></div>
        </div>
      </section>
      <header class="ach-heading">
        <h1 id="education-title" data-t="education.stagesTitle" data-accent="ach-accent">EDUCATIONAL <span class="ach-accent">STAGES</span></h1>
      </header>
      <!-- 2. Four school cards in one row -->
      <div class="stage-grid" id="school-grid" aria-label="Educational stages"></div>
    </section>
  </template>

  <template id="view-education-detail">
    <section class="view-panel inner-view education-detail-page" aria-labelledby="school-detail-name">
      <div class="detail-bg" id="school-detail-bg" aria-hidden="true"></div>
      <button class="back-button" type="button" data-view="education"><i class="bx bx-arrow-back" aria-hidden="true"></i> <span data-t="education.back">Back to Schools</span></button>
      <div class="education-detail-layout">
        <div class="education-detail-logo">
          <img class="school-logo-image" id="school-detail-logo" alt="" hidden>
          <div class="school-logo-placeholder" id="school-detail-logo-placeholder">
            <strong id="school-detail-mark">AM</strong>
            <span data-t="education.logoCaption">SCHOOL LOGO</span>
          </div>
        </div>
        <div class="education-detail-copy">
          <p class="eyebrow"><span class="eyebrow-line"></span> <span id="school-detail-level">EDUCATION</span></p>
          <h1 id="school-detail-name">School name</h1>
          <p class="education-detail-program" id="school-detail-program"></p>
          <span class="education-detail-status" id="school-detail-status"></span>
          <p class="education-detail-description" id="school-detail-description"></p>
        </div>
        <!-- Graduation photo: filled from gradPhotoPath / gradCaption in content.js (hidden when a school has none) -->
        <figure class="education-grad" id="school-detail-grad" hidden><img alt=""><figcaption></figcaption></figure>
      </div>
      <section class="school-achievement-section" aria-labelledby="school-achievement-title">
        <h2 class="school-achievement-title" id="school-achievement-title" data-t="education.achievementsTitle">ACHIEVEMENTS AT THIS SCHOOL</h2>
        <div class="school-achievements-grid" id="school-achievements"></div>
      </section>
    </section>
  </template>

  <template id="view-family-friends">
    <section class="view-panel inner-view connections-page" aria-labelledby="connections-title">
      <header class="connections-header">
        <p class="eyebrow"><span class="eyebrow-line"></span> <span data-t="connections.eyebrow">THE PEOPLE WHO MAKE THE JOURNEY MEANINGFUL</span></p>
        <h1 id="connections-title" data-t="connections.title">FAMILY <span>&amp; FRIENDS</span></h1>
      </header>
      <div class="connections-grid">
        <article class="connection-panel" aria-labelledby="family-title">
          <div class="connection-copy">
            <p class="eyebrow"><span class="eyebrow-line"></span> <span data-t="family.eyebrow">THE PEOPLE CLOSEST TO HOME</span></p>
            <h2 id="family-title" data-t="family.title">MY <span>FAMILY</span></h2>
            <p class="placeholder-page-subtitle" data-t="family.subtitle">More about the people who are part of my story.</p>
          </div>
          <div class="memory-slots" aria-label="Future family photo placeholders">
            <div class="memory-slot" data-slot="family.0"><i class="bx bx-image-add" aria-hidden="true"></i><span data-t="family.slots.0.label">PHOTO SLOT 01</span><small data-t="family.slots.0.caption">Family photo</small></div>
            <div class="memory-slot" data-slot="family.1"><i class="bx bx-image-add" aria-hidden="true"></i><span data-t="family.slots.1.label">PHOTO SLOT 02</span><small data-t="family.slots.1.caption">Add a description later</small></div>
            <div class="memory-slot" data-slot="family.2"><i class="bx bx-image-add" aria-hidden="true"></i><span data-t="family.slots.2.label">PHOTO SLOT 03</span><small data-t="family.slots.2.caption">Add a memory later</small></div>
          </div>
          <p class="placeholder-note"><i class="bx bx-lock-alt" aria-hidden="true"></i> <span data-t="family.note">This space is ready for details you choose to share.</span></p>
        </article>
        <article class="connection-panel" aria-labelledby="friends-title">
          <div class="connection-copy">
            <p class="eyebrow"><span class="eyebrow-line"></span> <span data-t="friends.eyebrow">THE PEOPLE ALONG THE WAY</span></p>
            <h2 id="friends-title" data-t="friends.title">MY <span>PEOPLE</span></h2>
            <p class="placeholder-page-subtitle" data-t="friends.subtitle">Memories, friendships, and the people who make the journey meaningful.</p>
          </div>
          <div class="memory-slots" aria-label="Future friends photo placeholders">
            <div class="memory-slot" data-slot="friends.0"><i class="bx bx-image-add" aria-hidden="true"></i><span data-t="friends.slots.0.label">PHOTO SLOT 01</span><small data-t="friends.slots.0.caption">Friends photo</small></div>
            <div class="memory-slot" data-slot="friends.1"><i class="bx bx-image-add" aria-hidden="true"></i><span data-t="friends.slots.1.label">PHOTO SLOT 02</span><small data-t="friends.slots.1.caption">Add a description later</small></div>
            <div class="memory-slot" data-slot="friends.2"><i class="bx bx-image-add" aria-hidden="true"></i><span data-t="friends.slots.2.label">PHOTO SLOT 03</span><small data-t="friends.slots.2.caption">Add a memory later</small></div>
          </div>
          <p class="placeholder-note"><i class="bx bx-lock-alt" aria-hidden="true"></i> <span data-t="friends.note">This space is ready for details you choose to share.</span></p>
        </article>
      </div>
    </section>
  </template>
</body>
</html>
