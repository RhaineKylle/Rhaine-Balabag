<!--
  ====================================================================
   HOW TO EDIT THIS WEBSITE
   Every word on the site is written in this file. Search (Ctrl+F) for
   the text you want to change and edit it. Don't touch the tags
   (<span class="...">), only the words between them.

   PAGE MAP (search for these banners):
     LOADING SCREEN ... the car start-up animation
     HEADER / NAV ..... menu buttons
     HOME PAGE ........ name, tagline, social links, CV button
     PERSONAL INFO .... about me, hobbies, skills, statement
     ACHIEVEMENTS ..... certificates + school cards
     FAMILY & FRIENDS . photo slots

   PICTURES: put the file inside the assets/ folder, then change the
   src="..." path. Keep the data-soft word inside every <img>.
  ====================================================================
-->
<body>

  <!-- ================= LOADING SCREEN ================= -->
  <div class="loader" id="loader" role="status" aria-live="polite">
    <div class="loader-world" id="loader-world"><canvas id="loader-canvas" aria-hidden="true"></canvas></div>
    <div class="loader-vignette" aria-hidden="true"></div>
    <p class="loader-brand"><span>RHAINE</span><b>.</b></p>
    <div class="loader-dash" id="loader-dash" aria-hidden="true">
      <div class="ld-gauge ld-tach" id="ld-tach"></div>
      <div class="ld-center">
        <div class="ld-shift"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="ld-gearbox"><small>GEAR</small><b id="ld-gear">N</b></div>
        <div class="ld-lamps">
          <span class="ld-lamp amber" title="Engine"><svg viewBox="0 0 24 24"><path d="M4 10h2V8h4V6h4v2h3l2 3h2v5h-2l-2 3H9l-2-2H4z"/></svg></span>
          <span class="ld-lamp red" title="Battery"><svg viewBox="0 0 24 24"><path d="M3 7h18v12H3zM6 4h3v3H6zm9 0h3v3h-3zM6 12h4v1H6zm8 0h4v1h-4zm1.5-1.5h1v4h-1z"/></svg></span>
          <span class="ld-lamp red" title="Oil"><svg viewBox="0 0 24 24"><path d="M3 11h7l2-2h4l5 3-6 6H5l-2-3zm16-6c1 2 2 3 2 4a2 2 0 0 1-4 0c0-1 1-2 2-4z"/></svg></span>
          <span class="ld-lamp red" title="Seat belt"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2.5"/><path d="M8 9h8l1 7h-3v5h-4v-5H7zM9 9l7 9-1 1-7-9z"/></svg></span>
          <span class="ld-lamp amber" title="ABS"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/><text x="12" y="15" text-anchor="middle" font-size="6.5" font-weight="700" font-family="Arial">ABS</text></svg></span>
        </div>
        <div class="ld-odo"><span id="ld-odo">128440</span><small>KM</small></div>
      </div>
      <div class="ld-gauge ld-speedo" id="ld-speedo"></div>
    </div>
    <!-- The words under the loading bar, in order, separated by | -->
    <div class="loader-foot"><span id="loader-status" data-messages="WARMING UP THE ENGINE|SHIFTING GEARS|HITTING TOP SPEED|READY TO LAUNCH">SYSTEM CHECK…</span><b id="loader-percent">0%</b><div class="loader-bar"><i id="loader-fill"></i></div></div>
  </div>
  <div class="page-shift" id="page-shift" aria-hidden="true">
    <div class="ps-panel"><div class="ps-streaks"></div><div class="ps-edge"></div>
      <div class="ps-label"><span class="ps-mark"><b>R</b><b>B</b></span><span class="ps-title" id="ps-title"></span><span class="ps-line"><i></i></span></div>
    </div>
  </div>
  <div class="page-wipe" id="page-wipe" aria-hidden="true"></div>
  <div class="cursor-ring" id="cursor-ring" aria-hidden="true"></div>
  <div class="cursor-dot" id="cursor-dot" aria-hidden="true"></div>

  <div class="portfolio-shell">
    <canvas class="bg-canvas" id="bg-canvas" aria-hidden="true"></canvas>

    <!-- ================= HEADER / NAV ================= -->
    <header class="site-header">
      <button class="brand" type="button" data-view="home" aria-label="Rhaine — go to Home">
        <span class="brand-symbol" aria-hidden="true"><span>R</span><span>B</span></span>
        <span class="brand-word"><span>RHAINE</span><span class="brand-period">.</span></span>
      </button>

      <!-- The order of these 4 buttons is also the order of the Previous / Next bar at the bottom. -->
      <nav class="primary-nav" aria-label="Main navigation">
        <button class="nav-button is-active" type="button" data-view="home" aria-current="page">Home</button>
        <button class="nav-button" type="button" data-view="about">Personal Information</button>
        <button class="nav-button" type="button" data-view="education">Achievements</button>
        <button class="nav-button" type="button" data-view="family-friends">Family &amp; Friends</button>
      </nav>

      <button class="button button-primary header-cta" type="button" data-view="about">
        <span>Let's Connect</span><i class="bx bx-arrow-up-right" aria-hidden="true"></i>
      </button>
    </header>

    <main class="screen-stage">
      <div class="content-region" id="content-region" aria-live="polite" aria-atomic="true"></div>
    </main>

    <!-- PREVIOUS / NEXT bar (the page names between the arrows are filled in automatically from the menu above) -->
    <nav class="page-pager" id="page-pager" aria-label="Page navigation">
      <button class="pager-btn pager-prev" id="pager-prev" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        <span class="pager-text"><small class="pager-dir">Previous</small><strong class="pager-name"></strong></span>
      </button>
      <span class="pager-dots" id="pager-dots">
        <button class="pager-dot" type="button" data-view="home" aria-label="Home"></button>
        <button class="pager-dot" type="button" data-view="about" aria-label="Personal Information"></button>
        <button class="pager-dot" type="button" data-view="education" aria-label="Achievements"></button>
        <button class="pager-dot" type="button" data-view="family-friends" aria-label="Family &amp; Friends"></button>
      </span>
      <button class="pager-btn pager-next" id="pager-next" type="button">
        <span class="pager-text"><small class="pager-dir">Next</small><strong class="pager-name"></strong></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </nav>
    <span class="screen-grain" aria-hidden="true"></span>
  </div>
