<!--
  ====================================================================
   HOW TO EDIT THIS WEBSITE
   Every word on the site is written in this file. Search (Ctrl+F) for
   the text you want to change and edit it. Don't touch the tags
   (<span class="...">), only the words between them.

   PAGE MAP (search for these banners):
     LOADING SCREEN ... the car start-up animation
     HEADER / NAV ..... menu buttons
     HOME PAGE ........ photo, name, 3 buttons
     PERSONAL INFO .... about me, hobbies, skills, statement
     ACHIEVEMENTS ..... certificates + school cards
     FAMILY & FRIENDS . parents, siblings, friends (changes every 5 seconds)

   src="..." path. Keep the data-soft word inside every <img>.

      <div class="ld-center">
        <div class="ld-shift"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="ld-gearbox"><small>GEAR</small><b id="ld-gear">N</b></div>

          <span class="ld-lamp amber" title="Engine"><svg viewBox="0 0 24 24"><path d="M4 10h2V8h4V6h4v2h3l2 3h2v5h-2l-2 3H9l-2-2H4z"/></svg></span>

          <span class="ld-lamp red" title="Seat belt"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2.5"/><path d="M8 9h8l1 7h-3v5h-4v-5H7zM9 9l7 9-1 1-7-9z"/></svg></span>

        <!-- 4 PHOTOS in a 2 x 2 grid: Mother, Father / Siblings, Friends.
             Change the words inside <figcaption> and the picture path in src="...".

        <div class="fam-row">
          <figure class="fam-item">
            <div class="fam-photo"><span class="fam-placeholder"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg><small>Photo coming soon</small></span><img data-soft src="assets/images/family/mother.jpg" alt="Mother"></div>

          </figure>
          <figure class="fam-item">
            <div class="fam-photo"><span class="fam-placeholder"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg><small>Photo coming soon</small></span><img data-soft src="assets/images/family/father.jpg" alt="Father" style="object-position: center 53%"></div>
            <figcaption class="fam-caption"><strong>Father</strong>His protection gives me strength and confidence to face life's challenges.</figcaption>

          </figure>

          <!-- FRIENDS: ONE frame that changes photo by itself. data-seconds = how long each photo stays (5 = five seconds).
               To add a photo, copy one <div class="fam-slide"> line and change the number in the file name.
               The photos fill the frame, so the sides of wide group photos may be trimmed slightly. -->
          <figure class="fam-item">
            <div class="fam-photo fam-frame" id="friends-frame" data-seconds="5">
              <div class="fam-slide"><img data-soft src="assets/images/friends/friends-1.jpg" alt="Friends photo 1"></div>
              <div class="fam-slide"><img data-soft src="assets/images/friends/friends-2.jpg" alt="Friends photo 2"></div>

              <div class="fam-slide"><img data-soft src="assets/images/friends/friends-4.jpg" alt="Friends photo 4"></div>
            </div>
            <figcaption class="fam-caption"><strong>Friends</strong>The people who make life brighter through genuine friendship and unforgettable moments.</figcaption>
          </figure>
        </div>

      </div>
    </section>
